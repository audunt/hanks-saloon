<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UI tests</title>
</head>
<body>
<pre id="results">running...</pre>
<script>
  // Skip the saloon-doors intro so it doesn't cover the page during tests.
  try { sessionStorage.setItem('hanks-saloon-doors-seen', '1'); } catch {}
</script>
<iframe id="app" src="../site/index.html" style="width: 800px; height: 900px"></iframe>
<script type="module">
  import { test, info, assert, withFetch, jsonResponse, waitFor, finish } from './harness.js';
  import { TEXT } from '../site/js/copy.js';
  import { WORDS } from '../site/js/hangman-words.js';

  const gradeText = (percent) => TEXT.trivia.grades.find(([minimum]) => percent >= minimum)[2];

  const frame = document.getElementById('app');
  await new Promise((resolve) => {
    if (frame.contentDocument?.readyState === 'complete' && frame.contentDocument.querySelector('#view-home')) resolve();
    else frame.addEventListener('load', resolve, { once: true });
  });
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  // Predictable "random" numbers: Hank then deals hangman words in list order (WORDS[0], WORDS[1], …).
  win.Math.random = () => 0;
  const $ = (selector) => doc.querySelector(selector);
  const shown = (selector) => {
    const el = $(selector);
    return el && !el.hidden && win.getComputedStyle(el).display !== 'none';
  };
  const text = (selector) => $(selector).textContent.trim();
  const noFetch = () => { throw new Error('fetch should not have been called'); };

  async function go(view) {
    win.location.hash = view;
    await waitFor(() => shown(`#view-${view}`), `view ${view} visible`);
  }

  function setInput(selector, value) {
    const input = $(selector);
    input.value = value;
    input.dispatchEvent(new win.Event('input', { bubbles: true }));
  }

  const submit = (selector) => $(selector).requestSubmit();
  const pressKey = (key) => doc.dispatchEvent(new win.KeyboardEvent('keydown', { key, bubbles: true }));

  function triviaItem(question, correct, incorrect, difficulty = 'easy', category = 'General Knowledge') {
    const enc = encodeURIComponent;
    return { category: enc(category), difficulty, question: enc(question),
      correct_answer: enc(correct), incorrect_answers: incorrect.map(enc) };
  }

  function setSelect(selector, value) {
    $(selector).value = value;
    $(selector).dispatchEvent(new win.Event('change', { bubbles: true }));
  }

  // A fake Open Trivia DB: topic list, per-topic counts and (optionally) questions.
  const CATEGORIES = [
    { id: 9, name: 'General Knowledge' }, { id: 17, name: 'Science & Nature' },
    { id: 11, name: 'Entertainment: Film' }, { id: 10, name: 'Entertainment: Books' },
    { id: 30, name: 'Science: Gadgets' }, { id: 18, name: 'Science: Computers' },
  ];
  const GADGET_COUNTS = { category_id: 30, category_question_count: {
    total_question_count: 40, total_easy_question_count: 17, total_medium_question_count: 17, total_hard_question_count: 6 } };
  function triviaStub(questions = [], log = []) {
    return async (url) => {
      log.push(url);
      if (url.includes('api_category.php')) return jsonResponse({ trivia_categories: CATEGORIES });
      if (url.includes('api_count.php')) return jsonResponse(GADGET_COUNTS);
      return jsonResponse({ response_code: 0, results: questions });
    };
  }

  // --- Menu -----------------------------------------------------------------
  await test('home view is shown first, and there is no menu bar', async () => {
    assert(shown('#view-home'), 'home hidden');
    for (const v of ['joke', 'define', 'trivia', 'hangman']) assert(!shown(`#view-${v}`), `${v} visible`);
    assert(!doc.querySelector('nav'), 'menu bar still present');
    assert(doc.querySelector('.site-header .brand').hash === '#home', 'sign does not link home');
  });

  // --- Trivia topics (run before anything else opens the Showdown, which loads them) ---
  await test('topics: failed load keeps "any topic" and says so', async () => {
    await withFetch(win, () => Promise.reject(new TypeError('Failed to fetch')), async () => {
      await go('trivia');
      await waitFor(() => text('#trivia-availability') === TEXT.trivia.topicsFailed, 'failure hint');
    });
    assert($('#trivia-topic').options.length === 1 && $('#trivia-topic').value === '', 'topic list changed');
    await go('home');
  });

  await test('topics: next visit retries, groups the list and clears the failure hint', async () => {
    const log = [];
    await withFetch(win, triviaStub([], log), async () => {
      await go('trivia');
      await waitFor(() => $('#trivia-topic').options.length > 1, 'topics loaded');
    });
    assert(log.some((url) => url.includes('api_category.php')), 'no retry');
    const select = $('#trivia-topic');
    assert(select.options[0].value === '' && select.options[0].text === "Any ol' topic", select.options[0].text);
    const groups = [...select.querySelectorAll('optgroup')]
      .map((g) => `${g.label}: ${[...g.children].map((o) => `${o.text}=${o.value}`).join(', ')}`);
    assert(JSON.stringify(groups) === JSON.stringify([
      'Assorted: General Knowledge=9, Science & Nature=17',
      'Entertainment: Books=10, Film=11',
      'Science: Computers=18, Gadgets=30',
    ]), JSON.stringify(groups));
    assert(text('#trivia-availability') === '', 'failure hint not cleared');
    await go('home');
    await go('trivia');
    assert(log.filter((url) => url.includes('api_category.php')).length === 1, 'topics fetched again');
    await go('home');
  });

  const onlyVisible = () => ['home', 'joke', 'define', 'trivia', 'hangman'].filter((name) => shown(`#view-${name}`));

  await test('home page links to every activity, each poster with its own mugshot', async () => {
    const posters = [...doc.querySelectorAll('.activities .poster')];
    assert(JSON.stringify(posters.map((a) => a.hash)) === JSON.stringify(['#joke', '#define', '#trivia', '#hangman']),
      posters.map((a) => a.hash));
    const mugs = posters.map((a) => a.querySelector('.poster-mugshot use')?.getAttribute('href'));
    assert(JSON.stringify(mugs) === JSON.stringify(['#mug-joke', '#mug-lingo', '#mug-trivia', '#mug-hangman']), mugs);
    assert(mugs.every((id) => doc.querySelector(`symbol${id}`)), 'mugshot artwork missing');
  });

  await test('posters open each activity; its back link and the sign return to the saloon', async () => {
    for (const view of ['joke', 'define', 'trivia', 'hangman']) {
      doc.querySelector(`.poster[href="#${view}"]`).click();
      await waitFor(() => shown(`#view-${view}`), `${view} via poster`);
      assert(onlyVisible().join() === view, `visible: ${onlyVisible()}`);
      const back = doc.querySelector(`#view-${view} .back-link`);
      assert(back && back.hash === '#home', `${view} has no back link`);
      back.click();
      await waitFor(() => shown('#view-home'), `home via ${view} back link`);
    }
    await go('trivia');
    doc.querySelector('.site-header .brand').click();
    await waitFor(() => shown('#view-home') && onlyVisible().join() === 'home', 'home via the sign');
  });

  await test('saloon name, title and logo are in place', async () => {
    assert(doc.title === "Hank's Saloon", doc.title);
    assert(text('.brand-name') === "Hank's Saloon" && text('#home-heading') === "Hank's Saloon");
    assert(doc.querySelectorAll('use[href="#logo"]').length >= 3, 'logo missing');
    assert(!doc.querySelector('.doors'), 'doors intro shown although already seen');
  });

  await test('unknown address falls back to home', async () => {
    win.location.hash = 'nonsense';
    await waitFor(() => shown('#view-home'), 'home visible');
  });

  // --- Joke -------------------------------------------------------------------
  await test('joke: two-part joke shows setup, then punchline after a pause', async () => {
    await go('joke');
    await withFetch(win, async () => jsonResponse({ type: 'twopart', setup: 'Setup?', delivery: 'Punchline!' }), async () => {
      $('#joke-button').click();
      assert(text('#joke-status') === TEXT.joke.loading, 'no loading message');
      assert($('#joke-button').disabled, 'button not disabled while loading');
      await waitFor(() => shown('#joke-card'), 'joke card');
      assert(text('#joke-text') === 'Setup?', text('#joke-text'));
      assert(!shown('#joke-punchline'), 'punchline shown immediately');
      assert($('#joke-button').disabled, 'button re-enabled before punchline');
      await waitFor(() => shown('#joke-punchline'), 'punchline');
      assert(text('#joke-punchline') === 'Punchline!');
      await waitFor(() => !$('#joke-button').disabled, 'button re-enabled');
      assert(text('#joke-button') === TEXT.joke.again, text('#joke-button'));
      assert(text('#joke-status') === '', 'status not cleared');
    });
  });

  await test('joke: single joke keeps punchline hidden and line breaks intact', async () => {
    await withFetch(win, async () => jsonResponse({ type: 'single', joke: 'Line one\nLine two' }), async () => {
      $('#joke-button').click();
      await waitFor(() => !$('#joke-button').disabled && shown('#joke-card'), 'joke shown');
      assert(!shown('#joke-punchline'), 'punchline visible');
      assert($('#joke-text').textContent === 'Line one\nLine two', 'text changed');
      assert(win.getComputedStyle($('#joke-text')).whiteSpace === 'pre-line', 'line breaks not preserved');
    });
  });

  await test('joke: HTML in API text is shown as text, not rendered', async () => {
    await withFetch(win, async () => jsonResponse({ type: 'single', joke: '<img src=x onerror=alert(1)><b>bold</b>' }), async () => {
      $('#joke-button').click();
      await waitFor(() => !$('#joke-button').disabled, 'done');
      assert($('#joke-text').children.length === 0, 'HTML was rendered');
      assert(text('#joke-text').includes('<b>bold</b>'), 'text missing');
    });
  });

  await test('joke: network failure shows error and re-enables button', async () => {
    await withFetch(win, () => Promise.reject(new TypeError('Failed to fetch')), async () => {
      $('#joke-button').click();
      await waitFor(() => $('#joke-status').classList.contains('status-error'), 'error status');
      assert(text('#joke-status').includes('telegraph line to the joke teller is down'), text('#joke-status'));
      assert(!shown('#joke-card'), 'stale joke still visible');
      assert(!$('#joke-button').disabled, 'button still disabled');
    });
  });

  // --- Define -----------------------------------------------------------------
  await test('define: blank word shows a warning without a request', async () => {
    await go('define');
    await withFetch(win, noFetch, async () => {
      setInput('#define-input', '   ');
      submit('#define-form');
      assert($('#define-status').classList.contains('status-warning'), 'no warning');
      assert(text('#define-status') === TEXT.define.blank);
    });
  });

  await test('define: shows the word and its definition', async () => {
    let requested = '';
    await withFetch(win, async (url) => { requested = url; return jsonResponse([{ meanings: [{ definitions: [{ definition: 'A test definition.' }] }] }]); }, async () => {
      setInput('#define-input', '  hello ');
      submit('#define-form');
      assert(text('#define-status') === TEXT.define.loading('hello'), 'no loading message');
      await waitFor(() => shown('#define-card'), 'definition card');
      assert(text('#define-word') === 'hello', text('#define-word'));
      assert(text('#define-text') === 'A test definition.');
      assert(requested.endsWith('/hello'), requested);
      assert(text('#define-status') === '', 'status not cleared');
    });
  });

  await test('define: unknown word shows error and hides old definition', async () => {
    await withFetch(win, async () => jsonResponse({ title: 'No Definitions Found' }, 404), async () => {
      setInput('#define-input', 'qwzxv');
      submit('#define-form');
      await waitFor(() => $('#define-status').classList.contains('status-error'), 'error');
      assert(text('#define-status') === "Never heard of “qwzxv”, partner. It ain't in the dictionary.", text('#define-status'));
      assert(!shown('#define-card'), 'old definition still shown');
    });
  });

  // --- Trivia -----------------------------------------------------------------
  await test('trivia: invalid question counts are rejected without a request', async () => {
    await go('trivia');
    await withFetch(win, noFetch, async () => {
      for (const value of ['0', '21', '', '2.5']) {
        setInput('#trivia-amount', value);
        submit('#trivia-setup');
        assert(text('#trivia-status') === TEXT.trivia.badAmount(20), `value ${value}: ${text('#trivia-status')}`);
      }
    });
    setInput('#trivia-amount', '3');
  });

  await test('trivia: rate limit shows error and stays on setup', async () => {
    await withFetch(win, async () => jsonResponse({ response_code: 5, results: [] }, 429), async () => {
      submit('#trivia-setup');
      await waitFor(() => $('#trivia-status').classList.contains('status-error'), 'error');
      assert(text('#trivia-status').includes('one request every 5 seconds'));
      assert(shown('#trivia-setup') && !shown('#trivia-play'), 'left setup screen');
    });
  });

  await test('topics: hint shows how many questions, warns when too few, asks only once', async () => {
    const log = [];
    await withFetch(win, triviaStub([], log), async () => {
      setSelect('#trivia-topic', '30');
      await waitFor(() => text('#trivia-availability') === TEXT.trivia.available(40, undefined, 'Science: Gadgets'), 'count hint');
      assert(!$('#trivia-availability').classList.contains('too-few'), 'warned for 3 of 40');

      setSelect('#trivia-difficulty', 'hard');
      await waitFor(() => text('#trivia-availability') === TEXT.trivia.available(6, 'Gunslinger', 'Science: Gadgets'), 'hard hint');

      setInput('#trivia-amount', '10');
      await waitFor(() => $('#trivia-availability').classList.contains('too-few'), 'too-few warning');
      assert(text('#trivia-availability') === TEXT.trivia.available(6, 'Gunslinger', 'Science: Gadgets') + TEXT.trivia.tooFewSuffix,
        text('#trivia-availability'));

      setInput('#trivia-amount', '3');
      await waitFor(() => !$('#trivia-availability').classList.contains('too-few'), 'warning cleared');
    });
    assert(log.filter((url) => url.includes('api_count.php')).length === 1, `${log.length} requests`);
    assert(log[0].endsWith('category=30'), log[0]);
  });

  await test('topics: chosen topic is sent with the quiz; "any" clears the hint', async () => {
    const log = [];
    await withFetch(win, triviaStub([triviaItem('Q?', 'A', ['B', 'C', 'D'], 'hard', 'Science: Gadgets')], log), async () => {
      submit('#trivia-setup');
      await waitFor(() => shown('#trivia-play'), 'quiz started');
    });
    const quizUrl = log.find((url) => url.includes('api.php?'));
    assert(quizUrl.includes('category=30') && quizUrl.includes('difficulty=hard') && quizUrl.includes('amount=3'), quizUrl);
    assert(text('#trivia-category') === 'Science: Gadgets');
    $('#trivia-quit').click();
    $('#trivia-again').click();
    setSelect('#trivia-topic', '');
    await waitFor(() => text('#trivia-availability') === '', 'hint cleared');
  });

  await test('trivia: full quiz by clicking and by keyboard', async () => {
    const items = [
      triviaItem('What does arr[0] return?', 'First item', ['[last]', 'None', 'Error'], 'hard', 'Science: Computers'),
      triviaItem('Second?', 'B', ['A', 'C', 'D'], 'medium'),
      triviaItem('Third?', 'Yes', ['No', 'Maybe', 'Later']),
    ];
    let requested = '';
    await withFetch(win, async (url) => { requested = url; return jsonResponse({ response_code: 0, results: items }); }, async () => {
      $('#trivia-difficulty').value = 'hard';
      submit('#trivia-setup');
      await waitFor(() => shown('#trivia-play'), 'quiz started');
    });
    assert(requested.includes('amount=3') && requested.includes('difficulty=hard'), requested);
    assert(!requested.includes('category='), `topic sent although "any" chosen: ${requested}`);
    assert(!shown('#trivia-setup'), 'setup still visible');

    // Question 1: answer correctly by clicking.
    assert(text('#trivia-progress') === TEXT.trivia.progress(1, 3), text('#trivia-progress'));
    assert(text('#trivia-question') === 'What does arr[0] return?', text('#trivia-question'));
    assert(text('#trivia-category') === 'Science: Computers');
    assert($('#trivia-badge').classList.contains('difficulty-hard') && text('#trivia-badge') === TEXT.trivia.difficulty.hard);
    const bullets = () => [...$('#trivia-bullets').children].map((b) => b.className.replace('bullet', '').trim() || 'empty');
    assert(JSON.stringify(bullets()) === '["current","empty","empty"]', bullets());
    let buttons = [...$('#trivia-answers').children];
    assert(buttons.length === 4, `${buttons.length} answers`);
    assert(buttons.some((b) => b.textContent.includes('[last]')), 'bracket answer missing');
    assert(!shown('#trivia-next'), 'next shown before answering');
    const correct1 = buttons.findIndex((b) => b.textContent.endsWith('First item'));
    buttons[correct1].click();
    assert(text('#trivia-feedback') === TEXT.trivia.correct, text('#trivia-feedback'));
    assert(buttons[correct1].classList.contains('correct'));
    assert(buttons[correct1].querySelector('.bullet-hole'), 'no bullet hole where clicked');
    assert(buttons.every((b) => b.disabled), 'answers still enabled');
    assert(shown('#trivia-next') && text('#trivia-next') === TEXT.trivia.next);
    assert(JSON.stringify(bullets()) === '["hit","empty","empty"]', bullets());

    // Answering again must not change anything.
    buttons[(correct1 + 1) % 4].click();
    pressKey(String(((correct1 + 1) % 4) + 1));
    assert(!buttons.some((b) => b.classList.contains('wrong')), 'second answer accepted');

    // Question 2: answer wrongly with the keyboard.
    $('#trivia-next').click();
    assert(text('#trivia-progress') === TEXT.trivia.progress(2, 3));
    assert(JSON.stringify(bullets()) === '["hit","current","empty"]', bullets());
    assert(text('#trivia-feedback') === '' && !shown('#trivia-next'), 'previous feedback not cleared');
    buttons = [...$('#trivia-answers').children];
    const correct2 = buttons.findIndex((b) => b.textContent.endsWith('B'));
    const wrong2 = (correct2 + 1) % 4;
    pressKey('9'); // out of range: ignored
    assert(!buttons[0].disabled, 'out-of-range key answered');
    pressKey(String(wrong2 + 1));
    assert(buttons[wrong2].classList.contains('wrong'), 'wrong answer not marked');
    assert(buttons[correct2].classList.contains('correct'), 'correct answer not revealed');
    assert(text('#trivia-feedback') === `${TEXT.trivia.wrongPrefix}B`.trim(), text('#trivia-feedback'));
    assert(buttons[wrong2].querySelector('.bullet-hole'), 'no bullet hole for keyboard answer');
    assert(JSON.stringify(bullets()) === '["hit","miss","empty"]', bullets());

    // Question 3: correct, then see score.
    $('#trivia-next').click();
    buttons = [...$('#trivia-answers').children];
    buttons.find((b) => b.textContent.endsWith('Yes')).click();
    assert(text('#trivia-next') === TEXT.trivia.last, text('#trivia-next'));
    $('#trivia-next').click();

    assert(shown('#trivia-result') && !shown('#trivia-play'), 'result not shown');
    assert(text('#trivia-score') === '2 / 3', text('#trivia-score'));
    assert(text('#trivia-message') === `66% · ${gradeText(66)}`, text('#trivia-message'));
    assert($('#trivia-score').classList.contains('ok'));
  });

  await test('trivia: play again returns to setup with previous choices kept', async () => {
    $('#trivia-again').click();
    assert(shown('#trivia-setup') && !shown('#trivia-result'));
    assert($('#trivia-amount').value === '3' && $('#trivia-difficulty').value === 'hard');
  });

  await test('trivia: quitting before answering shows "No questions answered"', async () => {
    await withFetch(win, async () => jsonResponse({ response_code: 0, results: [triviaItem('Q?', 'A', ['B', 'C', 'D'])] }), async () => {
      submit('#trivia-setup');
      await waitFor(() => shown('#trivia-play'), 'quiz started');
    });
    $('#trivia-quit').click();
    assert(shown('#trivia-result'));
    assert(text('#trivia-message') === TEXT.trivia.noAnswers, text('#trivia-message'));
    pressKey('1'); // no quiz running: must not throw or change anything
    assert(shown('#trivia-result'));
  });

  await test('trivia: quitting midway scores only answered questions', async () => {
    $('#trivia-again').click();
    const items = [triviaItem('Q1?', 'A', ['B', 'C', 'D']), triviaItem('Q2?', 'A', ['B', 'C', 'D'])];
    await withFetch(win, async () => jsonResponse({ response_code: 0, results: items }), async () => {
      submit('#trivia-setup');
      await waitFor(() => shown('#trivia-play'), 'quiz started');
    });
    [...$('#trivia-answers').children].find((b) => b.textContent.endsWith('A')).click();
    $('#trivia-quit').click();
    assert(text('#trivia-score') === '1 / 1' && text('#trivia-message') === `100% · ${gradeText(100)}`, text('#trivia-message'));
  });

  await test('trivia: number keys do nothing on other views', async () => {
    $('#trivia-again').click();
    await withFetch(win, async () => jsonResponse({ response_code: 0, results: [triviaItem('Q?', 'A', ['B', 'C', 'D'])] }), async () => {
      submit('#trivia-setup');
      await waitFor(() => shown('#trivia-play'), 'quiz started');
    });
    await go('joke');
    pressKey('1');
    await go('trivia');
    assert(![...$('#trivia-answers').children].some((b) => b.disabled), 'answered from another view');
    assert(text('#trivia-progress') === TEXT.trivia.progress(1, 1), 'quiz state lost when switching views');
    $('#trivia-quit').click();
    $('#trivia-again').click();
  });

  // --- Hangman's Hill -------------------------------------------------------------
  const scene = () => $('#hm-scene');
  const key = (letter) => $(`#hm-keyboard [data-letter="${letter}"]`);
  const keys = () => [...doc.querySelectorAll('#hm-keyboard .hm-key')];
  const letters = () => [...doc.querySelectorAll('#hm-word .hm-letter')].map((l) => l.textContent || '_').join('');
  const missingFrom = (word) => [...'abcdefghijklmnopqrstuvwxyz'].filter((l) => !word.includes(l));

  await test('hangman: first visit deals a word in blanks on an empty gallows', async () => {
    await go('hangman');
    const { word } = WORDS[0];
    assert(letters() === '_'.repeat(word.length), letters());
    assert(scene().dataset.stage === '0' && !scene().dataset.result, JSON.stringify(scene().dataset));
    assert(keys().length === 26 && keys().every((k) => !k.disabled), 'keyboard not ready');
    assert(text('#hm-story') === TEXT.hangman.story[0], text('#hm-story'));
    assert(text('#hm-misses') === TEXT.hangman.misses(0, 6), text('#hm-misses'));
    assert(!shown('#hm-telegram'), 'telegram already showing');
    assert($('#hm-word').getAttribute('aria-label').startsWith(TEXT.hangman.wordLabel(word.length)), 'no label for screen readers');
  });

  await test('hangman: right letters reveal, wrong ones march the cowboy on', async () => {
    const { word } = WORDS[0];
    const right = word[2];
    key(right).click();
    assert(letters() === [...word].map((l) => (l === right ? l : '_')).join(''), letters());
    assert(key(right).disabled && key(right).classList.contains('hit'), 'hit key not marked');
    assert(scene().dataset.stage === '0', 'a right guess moved the scene');

    const wrong = missingFrom(word);
    for (let miss = 1; miss <= 5; miss++) {
      pressKey(wrong[miss - 1]);
      assert(scene().dataset.stage === String(miss), `stage ${scene().dataset.stage} after ${miss} misses`);
      assert(text('#hm-story') === TEXT.hangman.story[miss], text('#hm-story'));
      assert(key(wrong[miss - 1]).classList.contains('miss'), 'miss key not marked');
    }
    assert(text('#hm-misses') === TEXT.hangman.misses(5, 6), text('#hm-misses'));
    assert(text('#hm-wrong') === wrong.slice(0, 5).join(' ').toUpperCase(), text('#hm-wrong'));

    pressKey(wrong[0]); // already guessed: ignored
    key(right).click();
    assert(scene().dataset.stage === '5', 'repeat guess counted');
  });

  await test('hangman: the sixth miss pulls the lever and the telegram gives the word', async () => {
    const { word, meaning } = WORDS[0];
    pressKey(missingFrom(word)[5]);
    assert(scene().dataset.stage === '6' && scene().dataset.result === 'lost', JSON.stringify(scene().dataset));
    assert(shown('#hm-telegram') && $('#hm-telegram').classList.contains('lost'), 'no telegram');
    assert(text('#hm-telegram-title') === TEXT.hangman.lostTitle, text('#hm-telegram-title'));
    assert(text('#hm-telegram-word') === word && text('#hm-telegram-meaning') === meaning, text('#hm-telegram-word'));
    assert(text('#hm-story') === TEXT.hangman.story[6], text('#hm-story'));
    assert(letters() === word, `word not revealed: ${letters()}`);
    assert(keys().every((k) => k.disabled), 'keys still enabled');
    pressKey(missingFrom(word)[6]);
    assert(text('#hm-misses') === TEXT.hangman.misses(6, 6), 'guess accepted after losing');
  });

  await test('hangman: "Another word" resets the scene with a new word', async () => {
    $('#hm-new').click();
    const { word } = WORDS[1];
    assert(letters() === '_'.repeat(word.length), letters());
    assert(scene().dataset.stage === '0' && !scene().dataset.result, JSON.stringify(scene().dataset));
    assert(!shown('#hm-telegram'), 'telegram still showing');
    assert(keys().every((k) => !k.disabled && k.className === 'hm-key'), 'keys not reset');
    assert(text('#hm-wrong') === '' && text('#hm-story') === TEXT.hangman.story[0], 'old game left over');
    assert(!scene().classList.contains('hm-reset'), 'animations left switched off');
  });

  await test('hangman: guessing every letter saves the cowboy', async () => {
    const { word, meaning } = WORDS[1];
    pressKey(missingFrom(word)[0]); // one miss on the way
    for (const letter of new Set(word)) key(letter).click();
    assert(scene().dataset.result === 'won', JSON.stringify(scene().dataset));
    assert(text('#hm-story') === TEXT.hangman.storyWon, text('#hm-story'));
    assert(shown('#hm-telegram') && !$('#hm-telegram').classList.contains('lost'), 'no win telegram');
    assert(text('#hm-telegram-title') === TEXT.hangman.wonTitle && text('#hm-telegram-meaning') === meaning, text('#hm-telegram-title'));
    assert(letters() === word && keys().every((k) => k.disabled), 'board not finished');
  });

  await test('hangman: typing does nothing on other views, and the game waits for you', async () => {
    $('#hm-new').click();
    const { word } = WORDS[2];
    await go('joke');
    pressKey(word[0]);
    pressKey(missingFrom(word)[0]);
    await go('hangman');
    assert(letters() === '_'.repeat(word.length), `game changed while away: ${letters()}`);
    assert(scene().dataset.stage === '0', 'miss counted while away');
  });

  // --- Phone width ----------------------------------------------------------------
  await test('no sideways scrolling at 360px wide on any view', async () => {
    frame.style.width = '360px';
    try {
      // Fill each view with content first so the widest state is measured.
      await withFetch(win, async (url) => url.includes('opentdb')
        ? jsonResponse({ response_code: 0, results: [triviaItem('A fairly long question to see how it wraps on a small phone screen?', 'Answer', ['Another answer', 'Something else', 'Last'], 'medium', 'Entertainment: Cartoon & Animations')] })
        : jsonResponse([{ meanings: [{ definitions: [{ definition: 'A definition long enough to wrap onto several lines on a phone.' }] }] }]),
      async () => {
        await go('define');
        setInput('#define-input', 'serendipity');
        submit('#define-form');
        await waitFor(() => shown('#define-card'), 'definition');
        await go('trivia');
        submit('#trivia-setup');
        await waitFor(() => shown('#trivia-play'), 'quiz');
      });
      for (const view of ['home', 'joke', 'define', 'trivia', 'hangman']) {
        await go(view);
        const root = doc.documentElement;
        assert(root.scrollWidth <= root.clientWidth, `${view}: page is ${root.scrollWidth}px wide in a ${root.clientWidth}px window`);
        if (view === 'define') {
          const button = $('#define-button').getBoundingClientRect();
          assert(button.width > 0 && button.right <= root.clientWidth, 'Define button off screen');
        }
      }
    } finally {
      $('#trivia-quit').click();
      $('#trivia-again').click();
      frame.style.width = '800px';
    }
  });

  // --- Live services, end to end ------------------------------------------------
  await test('LIVE joke through the page', async () => {
    await go('joke');
    $('#joke-button').click();
    await waitFor(() => !$('#joke-button').disabled, 'joke finished', 30000);
    assert(shown('#joke-card') && text('#joke-text').length > 0, text('#joke-status'));
    info(`live joke shown${shown('#joke-punchline') ? ' with punchline' : ''}`);
  });

  await test('LIVE define "apple" through the page', async () => {
    await go('define');
    setInput('#define-input', 'apple');
    submit('#define-form');
    await waitFor(() => !$('#define-button').disabled, 'lookup finished', 30000);
    assert(shown('#define-card') && /fruit/i.test(text('#define-text')), text('#define-status') || text('#define-text'));
  });

  await test('LIVE 2-question trivia through the page', async () => {
    await go('trivia');
    setInput('#trivia-amount', '2');
    $('#trivia-difficulty').value = '';
    submit('#trivia-setup');
    await waitFor(() => shown('#trivia-play') || $('#trivia-status').classList.contains('status-error'), 'quiz or error', 30000);
    assert(shown('#trivia-play'), text('#trivia-status'));
    info(`live question: ${text('#trivia-question')}`);
    pressKey('1');
    $('#trivia-next').click();
    pressKey('2');
    $('#trivia-next').click();
    assert(shown('#trivia-result') && /^[0-2] \/ 2$/.test(text('#trivia-score')), text('#trivia-score'));
    info(`live score: ${text('#trivia-score')}`);
  });

  finish();
</script>
</body>
</html>
