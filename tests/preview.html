<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <style>html, body, iframe { margin: 0; border: 0; width: 100%; height: 100%; display: block; }</style>
</head>
<body>
<!-- Puts the app into a given state with fake data, for screenshots.
     Usage: preview.html?state=home|joke|define|define-error|trivia-setup|trivia-question|trivia-result|trivia-perfect|hangman
     For hangman, add &misses=0…6 for each stage of the scene, or &won.
     Quick Draw: quickdraw | quickdraw-holstered | quickdraw-firing | quickdraw-done
     Add &width=375 for a phone-sized frame, &doors to play the saloon-doors intro,
     &doorsAt=0.8 to freeze the intro 0.8 seconds in, or &hatsAt=1 (with trivia-perfect) to freeze the hat toss. Other animations are fast-forwarded
     to their end so screenshots are predictable. -->
<script>
  // Show the saloon-doors intro only when asked for (?doors), so screenshots show the page.
  try {
    const query = new URLSearchParams(location.search);
    if (query.has('doors') || query.has('doorsAt')) sessionStorage.removeItem('hanks-saloon-doors-seen');
    else sessionStorage.setItem('hanks-saloon-doors-seen', '1');
  } catch {}
</script>
<iframe id="app" src="../site/index.html"></iframe>
<script type="module">
  import { jsonResponse } from './harness.js';

  const params = new URLSearchParams(location.search);
  const state = params.get('state') || 'home';
  const frame = document.getElementById('app');
  if (params.get('width')) frame.style.width = `${params.get('width')}px`; // simulate a phone screen
  await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
  const win = frame.contentWindow;
  const $ = (s) => win.document.querySelector(s);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const enc = encodeURIComponent;

  const questions = [
    { category: enc('Science: Computers'), difficulty: 'medium', question: enc('What does the "HTTP" in a web address stand for?'),
      correct_answer: enc('HyperText Transfer Protocol'), incorrect_answers: ['High Transfer Text Protocol', 'HyperText Transmission Process', 'Hyperlink Text Transfer Program'].map(enc) },
  ];

  win.fetch = async (url) => {
    if (url.includes('api_category.php')) {
      return jsonResponse({ trivia_categories: [
        { id: 9, name: 'General Knowledge' }, { id: 22, name: 'Geography' }, { id: 23, name: 'History' },
        { id: 11, name: 'Entertainment: Film' }, { id: 12, name: 'Entertainment: Music' },
        { id: 18, name: 'Science: Computers' }, { id: 30, name: 'Science: Gadgets' },
      ] });
    }
    if (url.includes('api_count.php')) {
      return jsonResponse({ category_question_count: { total_question_count: 40, total_easy_question_count: 17,
        total_medium_question_count: 17, total_hard_question_count: 6 } });
    }
    if (url.includes('jokeapi')) return jsonResponse({ type: 'twopart', setup: 'Why do programmers prefer dark mode?', delivery: 'Because light attracts bugs.' });
    if (url.includes('qwzxv')) return jsonResponse({}, 404);
    if (url.includes('dictionaryapi')) return jsonResponse([{ meanings: [{ definitions: [{ definition: 'The occurrence and development of events by chance in a happy or beneficial way.' }] }] }]);
    return jsonResponse({ response_code: 0, results: questions });
  };

  const go = (view) => { win.location.hash = view; };

  if (state === 'joke') {
    go('joke');
    $('#joke-button').click();
  } else if (state.startsWith('define')) {
    go('define');
    $('#define-input').value = state === 'define-error' ? 'qwzxv' : 'serendipity';
    $('#define-form').requestSubmit();
  } else if (state === 'hangman') {
    // Hank deals WORDS[0]; guess two right letters, then &misses=N wrong ones, or the whole word with &won.
    win.Math.random = () => 0;
    go('hangman');
    await wait(100);
    const { WORDS } = await import('../site/js/hangman-words.js');
    const { word } = WORDS[0];
    const press = (letter) => $(`#hm-keyboard [data-letter="${letter}"]`).click();
    if (params.has('won')) {
      [...new Set(word)].forEach(press);
    } else {
      [...new Set(word)].slice(0, 2).forEach(press);
      const wrong = [...'zqxjvkwy'].filter((l) => !word.includes(l));
      wrong.slice(0, Number(params.get('misses') || 0)).forEach(press);
    }
  } else if (state.startsWith('quickdraw')) {
    // quickdraw (ready) | quickdraw-holstered | quickdraw-firing (3 hits, 1 miss) | quickdraw-done (5 hits, 1 miss)
    go('quickdraw');
    await wait(100);
    const pointer = (target, type, options = {}) => target.dispatchEvent(new win.PointerEvent(type, {
      bubbles: type !== 'pointerenter' && type !== 'pointerleave', cancelable: true, pointerType: 'touch', button: 0, ...options }));
    const at = (element, dx = 0.5, dy = 0.5) => {
      const box = element.getBoundingClientRect();
      return { clientX: box.x + box.width * dx, clientY: box.y + box.height * dy };
    };
    const holsterArea = $('#qd-holster');
    const shootBottle = (i) => { const glass = $(`.qd-bottle[data-bottle="${i}"] path`); pointer(glass, 'pointerdown', at(glass)); };
    const miss = (dx, dy) => pointer($('.qd-wall'), 'pointerdown', at($('#qd-range'), dx, dy));
    if (state !== 'quickdraw') pointer(holsterArea, 'pointerdown');
    if (state === 'quickdraw-firing' || state === 'quickdraw-done') {
      pointer(holsterArea, 'pointerleave');
      await wait(400);
      [0, 2, 3].forEach(shootBottle);
      miss(0.42, 0.3);
      if (state === 'quickdraw-done') {
        await wait(900);
        shootBottle(1);
        shootBottle(5);
      }
    }
  } else if (state === 'trivia-setup') {
    // Topic chosen, with more rounds than Hank has questions, so the warning shows.
    go('trivia');
    await wait(200);
    const select = (selector, value) => {
      $(selector).value = value;
      $(selector).dispatchEvent(new win.Event('change', { bubbles: true }));
    };
    select('#trivia-topic', '30');
    select('#trivia-difficulty', 'hard');
    $('#trivia-amount').value = '10';
    $('#trivia-amount').dispatchEvent(new win.Event('input', { bubbles: true }));
  } else if (state.startsWith('trivia')) {
    go('trivia');
    $('#trivia-setup').requestSubmit();
    await wait(200);
    const buttons = [...$('#trivia-answers').children];
    const perfect = state === 'trivia-perfect';
    buttons.find((b) => b.textContent.endsWith('HyperText Transfer Protocol') === perfect).click();
    if (state === 'trivia-result' || perfect) $('#trivia-next').click();
  }
  // (home needs no navigation: it's the default view)

  const animations = () => win.document.getAnimations();
  const inDoors = (animation) => animation.effect?.target?.closest?.('.doors');

  if (params.has('doorsAt')) {
    // Freeze the saloon-doors intro at the requested moment.
    const ms = Number(params.get('doorsAt')) * 1000;
    for (const animation of animations().filter(inDoors)) {
      animation.pause();
      animation.currentTime = ms;
    }
  } else if (params.has('hatsAt')) {
    // Freeze the hat toss (perfect trivia score) mid-air.
    const ms = Number(params.get('hatsAt')) * 1000;
    for (const animation of animations().filter((a) => a.effect?.target?.closest?.('.hat-toss'))) {
      animation.pause();
      animation.currentTime = ms;
    }
  } else {
    // Fast-forward entrance animations so screenshots don't catch them halfway.
    const settle = () => {
      for (const animation of animations()) {
        if (animation.effect?.getComputedTiming().endTime !== Infinity) animation.finish();
      }
    };
    await wait(300);
    settle();
    setTimeout(settle, 2000); // again, after the joke's delayed punchline appears
  }
</script>
</body>
</html>
