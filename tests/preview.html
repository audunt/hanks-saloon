<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <style>html, body, iframe { margin: 0; border: 0; width: 100%; height: 100%; display: block; }</style>
</head>
<body>
<!-- Puts the app into a given state with fake data, for screenshots.
     Usage: preview.html?state=home|joke|define|define-error|trivia-question|trivia-result|trivia-perfect
     Add &width=375 for a phone-sized frame, &doors to play the saloon-doors intro,
     &doorsAt=0.8 to freeze the intro 0.8 seconds in, or &hatsAt=1 (with trivia-perfect) to freeze the hat toss. Other animations are fast-forwarded
     to their end so screenshots are predictable. -->
<script>
  // Show the saloon-doors intro only when asked for (?doors), so screenshots show the page.
  try {
    const query = new URLSearchParams(location.search);
    if (query.has('doors') || query.has('doorsAt')) sessionStorage.removeItem('hanks-saloon-doors-seen');
    else sessionStorage.setItem('hanks-saloon-doors-seen', '1');
  } catch {}
</script>
<iframe id="app" src="../site/index.html"></iframe>
<script type="module">
  import { jsonResponse } from './harness.js';

  const params = new URLSearchParams(location.search);
  const state = params.get('state') || 'home';
  const frame = document.getElementById('app');
  if (params.get('width')) frame.style.width = `${params.get('width')}px`; // simulate a phone screen
  await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
  const win = frame.contentWindow;
  const $ = (s) => win.document.querySelector(s);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const enc = encodeURIComponent;

  const questions = [
    { category: enc('Science: Computers'), difficulty: 'medium', question: enc('What does the "HTTP" in a web address stand for?'),
      correct_answer: enc('HyperText Transfer Protocol'), incorrect_answers: ['High Transfer Text Protocol', 'HyperText Transmission Process', 'Hyperlink Text Transfer Program'].map(enc) },
  ];

  win.fetch = async (url) => {
    if (url.includes('jokeapi')) return jsonResponse({ type: 'twopart', setup: 'Why do programmers prefer dark mode?', delivery: 'Because light attracts bugs.' });
    if (url.includes('qwzxv')) return jsonResponse({}, 404);
    if (url.includes('dictionaryapi')) return jsonResponse([{ meanings: [{ definitions: [{ definition: 'The occurrence and development of events by chance in a happy or beneficial way.' }] }] }]);
    return jsonResponse({ response_code: 0, results: questions });
  };

  const go = (view) => { win.location.hash = view; };

  if (state === 'joke') {
    go('joke');
    $('#joke-button').click();
  } else if (state.startsWith('define')) {
    go('define');
    $('#define-input').value = state === 'define-error' ? 'qwzxv' : 'serendipity';
    $('#define-form').requestSubmit();
  } else if (state.startsWith('trivia')) {
    go('trivia');
    $('#trivia-setup').requestSubmit();
    await wait(200);
    const buttons = [...$('#trivia-answers').children];
    const perfect = state === 'trivia-perfect';
    buttons.find((b) => b.textContent.endsWith('HyperText Transfer Protocol') === perfect).click();
    if (state === 'trivia-result' || perfect) $('#trivia-next').click();
  }
  // (home needs no navigation: it's the default view)

  const animations = () => win.document.getAnimations();
  const inDoors = (animation) => animation.effect?.target?.closest?.('.doors');

  if (params.has('doorsAt')) {
    // Freeze the saloon-doors intro at the requested moment.
    const ms = Number(params.get('doorsAt')) * 1000;
    for (const animation of animations().filter(inDoors)) {
      animation.pause();
      animation.currentTime = ms;
    }
  } else if (params.has('hatsAt')) {
    // Freeze the hat toss (perfect trivia score) mid-air.
    const ms = Number(params.get('hatsAt')) * 1000;
    for (const animation of animations().filter((a) => a.effect?.target?.closest?.('.hat-toss'))) {
      animation.pause();
      animation.currentTime = ms;
    }
  } else {
    // Fast-forward entrance animations so screenshots don't catch them halfway.
    const settle = () => {
      for (const animation of animations()) {
        if (animation.effect?.getComputedTiming().endTime !== Infinity) animation.finish();
      }
    };
    await wait(300);
    settle();
    setTimeout(settle, 2000); // again, after the joke's delayed punchline appears
  }
</script>
</body>
</html>
